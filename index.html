<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTunebook</title>
    <meta name="theme-color" content="#183d30">
    <meta name="description" content="A handy tunebook with notation and melody playback">
    <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
    <div id="root">
        <div style="font-family: system-ui, sans-serif; padding: 24px; color: #222;">
            Loading MTunebook…
        </div>
    </div>
    <script>
        window.setTimeout(function () {
            var root = document.getElementById("root");
            var stillLoading = root && root.textContent.includes("Loading MTunebook");
            if (stillLoading) {
                var message = document.createElement("p");
                message.textContent = "Loading is taking longer than expected. Check your connection or try again.";
                var retry = document.createElement("button");
                retry.textContent = "Try again";
                retry.onclick = function () { window.location.reload(); };
                root.append(message, retry);
            }
        }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
