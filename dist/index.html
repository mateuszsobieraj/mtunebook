<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTunebook</title>
    <meta name="theme-color" content="#183d30">
    <meta name="description" content="A handy tunebook with notation and melody playback">
    <link rel="manifest" href="./manifest.webmanifest">
  <script type="module" crossorigin src="./assets/index-B4PHb8kC.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/abcjs-Yk-_Bz28.js">
  <link rel="stylesheet" crossorigin href="./assets/index-C51VoKUW.css">
</head>
<body>
    <div id="root">
        <div style="font-family: system-ui, sans-serif; padding: 24px; color: #222;">
            Loading MTunebook…
        </div>
    </div>
    <script>
        window.setTimeout(async function () {
            var root = document.getElementById("root");
            var stillLoading = root && root.textContent.includes("Loading MTunebook");
            var stylesMissing = getComputedStyle(document.body).backgroundImage === "none";

            if ((stillLoading || stylesMissing) && !sessionStorage.getItem("mtunebook-cache-recovered")) {
                sessionStorage.setItem("mtunebook-cache-recovered", "true");
                if ("serviceWorker" in navigator) {
                    var registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
                }
                if ("caches" in window) {
                    var keys = await caches.keys();
                    await Promise.all(keys.map(function (key) { return caches.delete(key); }));
                }
                window.location.reload();
            }
        }, 3000);
    </script>
</body>
</html>
