<!DOCTYPE html>

<head>

  <link rel="modulepreload" crossorigin href="./assets/abcjs-Yk-_Bz28.js">
  <link rel="stylesheet" crossorigin href="./assets/index-CWoT8y-s.css">
</head>
<body>
    <div id="root">
        <div style="font-family: system-ui, sans-serif; padding: 24px; color: #222;">
            Loading MTunebook...
        </div>
    </div>
    <script>
        window.setTimeout(function () {
            var isPages = window.location.hostname.endsWith("github.io");
            var isFallbackRoot = !window.location.pathname.includes("/dist/");
            var root = document.getElementById("root");
            var stillLoading = root && root.textContent.includes("Loading MTunebook");

            if (isPages && isFallbackRoot && stillLoading) {
                window.location.replace("./dist/");
            }
        }, 4000);
    </script>
</body>
